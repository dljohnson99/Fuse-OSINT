  #       condition: service_healthy
  #     neo4j:
  #       condition: service_healthy
  #   ports:
  #     - "8000:8000"
  #   env_file: .env
  # Uncommented once Phase 2/6 backend exists.

volumes:
  postgres_data:
  neo4j_data:
